spring.application.name=sigtau
server.port=8080

# Base de datos (PostgreSQL). Sobrescribir con variables de entorno en producción
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sigtau}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:admin}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT (el secreto debe tener al menos 32 caracteres)
jwt.secret=${JWT_SECRET:sigtau_dev_secret_cambiar_en_produccion_0123456789}
jwt.expiration-ms=3600000

# CORS: origen del frontend
app.cors.allowed-origin=${CORS_ORIGIN:http://localhost:5173}

# Administrador inicial (se crea solo si no existe)
app.admin.email=${ADMIN_EMAIL:admin@sigtau.local}
app.admin.password=${ADMIN_PASSWORD:Admin123!}
